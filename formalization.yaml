version: "v0.4"

project:
  name: "Sixfold Tverberg Counterexamples and Convex Equipartition Obstructions"
  description: >-
    We construct a counterexample to the generalized Nandakumar--Ramana Rao
    problem: in every dimension d > 17, there are d − 1 continuous functionals
    on convex bodies and a probability measure such that there is no convex
    partition of the unit ball into six parts of equal measure on which all
    these functionals are equalized. We also show that the topological Tverberg
    conjecture fails for sixfold intersections already in ℝ⁶: we construct a
    continuous map Δ³⁵ → ℝ⁶ whose images of six pairwise disjoint faces never
    meet.
  authors:
    - "Arseniy Akopyan"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Arseniy Akopyan"

classification:
  arxiv: ["math.CO", "math.MG", "math.AT"]
  msc2020: ["52C35", "55M20", "52A20", "55S91"]

sources:
  - title: "Sixfold Tverberg counterexamples and convex equipartition obstructions (Theorem A)"
    authors:
      - "Arseniy Akopyan"
    type: "paper"
    location: "paper/manuscript.tex, Theorem A"
    relationship: "formalizes"
    author_endorsement: "participated"
    note: >-
      Formalizes Theorem A (AkopyanSixfold.tverberg_counterexample, an
      unconditional almost six-embedding Δ³⁵ → ℝ⁶) in RequestProject/ and
      Solution.lean. Arseniy Akopyan is both the manuscript author and the
      human formalizer and responsible maintainer of the entire Lean
      development.
  - title: "Sixfold Tverberg counterexamples and convex equipartition obstructions (Theorem B, d ≥ 24, and Section 6 reduction)"
    authors:
      - "Arseniy Akopyan"
    type: "paper"
    location: "paper/manuscript.tex, Theorem B and Theorem 6.1"
    relationship: "adapts"
    author_endorsement: "participated"
    note: >-
      Theorem B in paper/manuscript.tex states the convex six-equipartition
      obstruction for d ≥ 24 (using 5d − 4 blocking markers and Theorem C via
      [AKS]). The present formalization adapts and strengthens Theorem B from
      d ≥ 24 to every dimension d > 17 (d ≥ 18)
      (AkopyanSixfold.convex_partition_counterexample_gt_17) by constructing an
      unconditional almost six-embedding Δ⁸⁹ → ℝ¹⁶
      (AkopyanSixfold.almostSix_ninety) via configuration-space comparison and
      relative Hurewicz lifting in AkopyanResearch/Completion/, and combining
      it with the 5d central blocking markers (exists_isBlocking_5d for
      d ≥ 18), Blaschke compactness, and inward-distance transfer in
      Solution.lean.
  - title: "Earlier TopTverberg Lean 4 development (Solution.lean, RequestProject/, and initial AkopyanResearch/ modules)"
    authors:
      - "Arseniy Akopyan"
    id: "https://github.com/akopjan/toptverbert-nandakumar/tree/e50f3db04b9c2652720d7aa49fcbf0c29524a60a"
    type: "other"
    location: "Solution.lean, RequestProject/, AkopyanResearch/ (preserved baseline; see verification/original-specification/Challenge36.lean.txt)"
    relationship: "adapts"
    license: "Apache-2.0"
    author_endorsement: "participated"
    note: >-
      The earlier Lean 4 development by Arseniy Akopyan (with AI assistance
      from Aristotle and Gemini) proved Theorem A unconditionally, proved the
      unconditional d ≥ 36 convex equipartition obstruction
      (AkopyanSixfold.convex_partition_counterexample), proved the existence of
      5d central blocking markers for all d ≥ 18 (exists_isBlocking_5d) and
      the conditional d ≥ 18 reduction (convex_partition_counterexample_ge_18)
      in Solution.lean (preserved byte-for-byte, SHA-256
      19b398c31f613a13421760c4713b021e7a94d3fb6ad018f490c0e02861e6d5f8), and
      developed the initial 43 quadratic arrangement and equivariant collapse
      modules in AkopyanResearch/. The later completion in
      AkopyanResearch/Completion/ (directed and maintained by Arseniy Akopyan
      with AI assistance from GPT-6 Astra Pro) extends that baseline by proving
      the relative lifting theorem (requiredRelativeLifting) and the
      unconditional Δ⁸⁹ → ℝ¹⁶ embedding (almostSix_ninety) to close the
      unconditional d > 17 theorem.
  - title: "homotopy-groups-lean: homotopy groups, Hurewicz and Whitehead infrastructure"
    authors:
      - "Vasily Ilin"
      - "The Tau Ceti contributors (Map.lean and Homotopy.lean)"
