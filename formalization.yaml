# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Sixfold Tverberg Counterexamples and Convex Equipartition Obstructions"
  description: >-
    We construct a counterexample to the generalized Nandakumar--Ramana Rao
    problem: in every dimension d > 17, there are d − 1 continuous functionals
    on convex bodies and a probability measure such that there is no convex
    partition of the unit ball into six parts of equal measure on which all
    these functionals are equalized. We also show that the topological Tverberg
    conjecture fails for sixfold intersections already in ℝ⁶: we construct a
    continuous map Δ³⁵ → ℝ⁶ whose images of six pairwise disjoint faces never
    meet.
  authors:
    - "Arseniy Akopyan"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Arseniy Akopyan"

classification:
  arxiv: ["math.CO", "math.MG", "math.AT"]
  msc2020: ["52C35", "55M20", "52A20", "55S91"]

sources:
  - title: "Sixfold Tverberg counterexamples and convex equipartition obstructions"
    authors:
      - "Arseniy Akopyan"
    type: "paper"
    location: "paper/manuscript.tex, Theorems A and B"
    relationship: "formalizes"
    author_endorsement: "participated"
    year: 2026
    note: >-
      Theorem A (AkopyanSixfold.tverberg_counterexample) is formalized
      unconditionally in Solution.lean. Theorem B
      (AkopyanSixfold.convex_partition_counterexample_gt_17) is formalized
      completely unconditionally in every dimension d > 17 (d ≥ 18) in
      AkopyanResearch/Completion/DimensionEighteen.lean (exported via
      PalomarSolution.lean), combining the unconditional almost six-embedding
      Δ⁸⁹ → ℝ¹⁶ (AkopyanSixfold.almostSix_ninety) with the 5d central blocking
      marker construction (exists_isBlocking_5d for d ≥ 18), Blaschke
      compactness (blaschke_isCompact_subsets_unitBall, exists_eta_of_isBlocking),
      join-padding, and Hausdorff-continuous inward-distance transfer in
      Solution.lean.

status:
  scope: >-
    Sorry-free Lean 4 formalization of AkopyanSixfold.tverberg_counterexample
    (unconditional proof of Theorem A: an almost six-embedding Δ³⁵ → ℝ⁶),
    AkopyanSixfold.almostSix_ninety (unconditional almost six-embedding
    Δ⁸⁹ → ℝ¹⁶), and AkopyanSixfold.convex_partition_counterexample_gt_17
    (completely unconditional proof of Theorem B for every d > 17), together
    with exists_isBlocking_5d (5d central blocking markers for all d ≥ 18),
    blaschke_isCompact_subsets_unitBall (Blaschke selection theorem),
    exists_eta_of_isBlocking (Lemma 5.2), central_partition_normal_rank
    (Lemma 4.2), and convex_partition_counterexample (d ≥ 36) in Solution.lean.
    Verified under standard Lean 4 axioms [propext, Quot.sound, Classical.choice]
    without custom axioms or sorry.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms:
    - "propext"
    - "Quot.sound"
    - "Classical.choice"
  main_results:
    - declaration: "AkopyanSixfold.tverberg_counterexample"
      file: "PalomarSolution.lean"
      sorry_count: 0
      axioms:
        - "propext"
        - "Quot.sound"
        - "Classical.choice"
      comparator_config: "comparator.json"
    - declaration: "AkopyanSixfold.convex_partition_counterexample_gt_17"
      file: "PalomarSolution.lean"
      sorry_count: 0
      axioms:
        - "propext"
        - "Quot.sound"
        - "Classical.choice"
      comparator_config: "comparator.json"

fidelity:
  divergences: >-
    Both AkopyanSixfold.tverberg_counterexample (Theorem A, Δ³⁵ → ℝ⁶) and
    AkopyanSixfold.convex_partition_counterexample_gt_17 (Theorem B, for all
    d > 17) are formalized completely unconditionally without any extra
    hypotheses in Challenge.lean. Note that the explicit uniform quantifier
    over measures is proved internally in convex_partition_of_embedding_and_blocking
    rather than exposed as a separate conjunct in Challenge.lean.

automation:
  methods:
    - method: "agent"
      models: ["Aristotle", "Gemini", "GPT"]
      framework: "AI-assisted Lean 4 formalization"
      tool_setup: >-
        Theorem A proof closure in RequestProject/ assisted by Aristotle;
        join-padding, Blaschke selection, normal rank ≤ 5, RREF, blocking
        point existence for d ≥ 18, inward-distance transfer, quadratic
        arrangement modules, and relative lifting completion assisted by
        Gemini and GPT.

review:
  status: "self-assessed"

alignment:
  namespace: "AkopyanSixfold"
  statements:
    - source: "Sixfold Tverberg counterexamples and convex equipartition obstructions (paper/manuscript.tex), Theorem A"
      lean: "AkopyanSixfold.tverberg_counterexample"
      module: "Challenge"
      status: "proved (unconditional)"
      note: >-
        Unconditional proof of an almost six-embedding Δ³⁵ → ℝ⁶.
    - source: "Sixfold Tverberg counterexamples and convex equipartition obstructions (paper/manuscript.tex), Theorem B"
      lean: "AkopyanSixfold.convex_partition_counterexample_gt_17"
      module: "Challenge"
      status: "proved (unconditional for d > 17)"
      note: >-
        Formalizes Theorem B unconditionally for every d > 17 (d ≥ 18),
        combining the unconditional almost six-embedding Δ⁸⁹ → ℝ¹⁶
        (AkopyanSixfold.almostSix_ninety) with 5d central blocking markers
        (exists_isBlocking_5d for d ≥ 18), Blaschke selection
        (blaschke_isCompact_subsets_unitBall and exists_eta_of_isBlocking),
        join-padding to Δ^(5d-1) → ℝ^(d-2), and Hausdorff-continuous
        inward-distance transfer.
