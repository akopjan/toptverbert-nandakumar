    (unconditional proof of Theorem A from paper/manuscript.tex: an almost
    six-embedding Δ³⁵ → ℝ⁶), AkopyanSixfold.almostSix_ninety (unconditional
    almost six-embedding Δ⁸⁹ → ℝ¹⁶), and
    AkopyanSixfold.convex_partition_counterexample_gt_17 (unconditional convex
    six-equipartition obstruction for every d > 17, strengthening Theorem B of
    paper/manuscript.tex from d ≥ 24 and extending the earlier unconditional
    d ≥ 36 theorem AkopyanSixfold.convex_partition_counterexample in
    Solution.lean). Verified under standard Lean 4 axioms [propext, Quot.sound,
    Classical.choice] without custom axioms or sorry.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms:
    - "propext"
    - "Quot.sound"
    - "Classical.choice"
  main_results:
