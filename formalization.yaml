      - "Jack McCarthy"
    id: "https://github.com/Deicyde/hatcher-at/tree/6d729567d1573a7e8785773a55de36d0e3ec5761"
    type: "other"
    location: "Hatcher/; docs/third_party/hatcher-at/PROVENANCE.json"
