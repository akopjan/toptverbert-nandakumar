      sorry_count: 0
      axioms:
        - "propext"
        - "Quot.sound"
        - "Classical.choice"
      comparator_config: "comparator.json"

fidelity:
  divergences: >-
    AkopyanSixfold.tverberg_counterexample formalizes Theorem A of
    paper/manuscript.tex (Δ³⁵ → ℝ⁶) unconditionally. Theorem B of
    paper/manuscript.tex states the convex six-equipartition obstruction for
    d ≥ 24 (using 5d − 4 central blocking markers and Theorem C via [AKS]),
    and the earlier Lean baseline in Solution.lean proved it unconditionally
    for d ≥ 36 (via a fivefold join of Theorem A) together with a conditional
    reduction for d ≥ 18 (convex_partition_counterexample_ge_18, conditional on
    an almost six-embedding Δ⁸⁹ → ℝ¹⁶). The present completion in
    AkopyanResearch/Completion/DimensionEighteen.lean strengthens the
    unconditional dimension bound beyond both d ≥ 36 and the manuscript's
    d ≥ 24 theorem to every integer dimension d > 17 (d ≥ 18) by proving the
    unconditional almost six-embedding Δ⁸⁹ → ℝ¹⁶ (AkopyanSixfold.almostSix_ninety)
    and discharging the hypothesis of convex_partition_counterexample_ge_18.
    Note also that the uniform concentrated-measure quantifier is proved
    internally in convex_partition_of_embedding_and_blocking rather than
    exposed as a separate conjunct in Challenge.lean.

