    id: "https://github.com/Vilin97/homotopy-groups-lean/tree/c66523531ff172d7f41913d94e56921e790a1b47"
    type: "other"
    location: "Submission/; docs/third_party/homotopy-groups-lean/PROVENANCE.json"
    relationship: "adapts"
    license: "Apache-2.0"
    note: >-
      Selected proof modules were ported from Lean 4.32.2 to Lean 4.36.0-rc2 with
      original headers and Apache-2.0 license retained to support the relative
