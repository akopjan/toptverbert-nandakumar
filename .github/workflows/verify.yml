# The compared mathematical statements are exactly those in Challenge.lean.
name: Pinned Lean and Comparator verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out the exact submitted sources
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Select Python with the standard TOML parser
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Verify committed dependency pins
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import pathlib
          import re
          root = pathlib.Path('.')
          assert (root / 'lean-toolchain').read_text().strip() == 'leanprover/lean4:v4.35.0'
          manifest = json.loads((root / 'lake-manifest.json').read_text())
          packages = manifest['packages']
          mathlib = next(p for p in packages if p['name'] == 'mathlib')
          assert mathlib['rev'] == '56a005855ea17e0b0958f73ec801ae140b0a1679'
          for package in packages:
              assert package['type'] == 'git', package
              assert re.fullmatch('[0-9a-f]{40}', package['rev']), package
          PY

      - name: Install pinned Lean and fetch pinned Mathlib cache
        uses: leanprover/lean-action@ba3fdfe5c4476c925da13bf11a005ddb47e47aee # v1 resolved 2026-11-24 UTC
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: true
          use-github-cache: false

      - name: Build every configured proof target and audit exact statements
        shell: bash
        run: |
          SKIP_MATHLIB_CACHE=1 bash scripts/verify.sh
          git diff --exit-code -- lean-toolchain lake-manifest.json lakefile.toml comparator.json

      - name: Install the official Comparator sandbox dependency
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap

      - name: Run bundled Comparator and independent kernels
        shell: bash
        run: bash scripts/verify-comparator.sh
