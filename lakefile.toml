name = "TopTverberg"
version = "0.1.0"
weakLeanArgs = ["-j1"]
defaultTargets = ["RequestProject", "AkopyanResearch", "Challenge", "Solution", "PalomarSolution", "Audit"]

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.36.0-rc2"

[[lean_lib]]
name = "RequestProject"
globs = ["RequestProject.+"]

[[lean_lib]]
name = "AkopyanResearch"
globs = ["AkopyanResearch.*"]

[[lean_lib]]
name = "Challenge"
roots = ["Challenge"]

[[lean_lib]]
name = "Solution"
roots = ["Solution"]

[[lean_lib]]
name = "PalomarSolution"
roots = ["PalomarSolution"]

[[lean_lib]]
name = "Audit"
roots = ["Audit"]

[[lean_lib]]
name = "Submission"
globs = ["Submission.+"]

[[lean_lib]]
name = "Hatcher"
globs = ["Hatcher.+"]
