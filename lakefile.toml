name = "TopTverberg"
version = "0.1.0"
defaultTargets = ["RequestProject", "AkopyanResearch", "Challenge", "Solution", "Audit"]

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.35.0"

[[lean_lib]]
name = "RequestProject"
globs = ["RequestProject.+"]

[[lean_lib]]
name = "AkopyanResearch"
globs = ["AkopyanResearch.*"]

[[lean_lib]]
name = "Challenge"
roots = ["Challenge"]

[[lean_lib]]
name = "Solution"
roots = ["Solution"]

[[lean_lib]]
name = "Audit"
roots = ["Audit"]
